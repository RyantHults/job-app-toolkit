<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="options.css">
  <title>Form Filler — Job App Toolkit</title>
</head>
<body>
  <h1>Form Filler</h1>
  <p class="subtitle">Job App Toolkit module — saved profiles and form autofill</p>

  <!-- Module activity -->
  <section class="section" aria-label="Module activity">
    <div class="row">
      <label class="toggle">
        <input type="checkbox" id="active-toggle">
        <span>Module active</span>
      </label>
    </div>
  </section>

  <!-- Active profile selection + fill action -->
  <section class="section" aria-label="Profile and fill">
    <div class="row">
      <label for="profile-select" class="label">Profile</label>
      <select id="profile-select" aria-label="Active profile"></select>
      <button type="button" id="fill-btn" class="btn btn-primary">Fill Page</button>
      <button type="button" id="add-field-btn" class="btn">+ Add Current Field</button>
      <button type="button" id="add-all-fields-btn" class="btn">+ Add All Fields</button>
    </div>
  </section>

  <!-- Fields of the active profile -->
  <section class="section" aria-label="Active profile fields">
    <h2>Active Profile Fields</h2>
    <ul id="fields-list"></ul>
  </section>

  <!-- Profile management -->
  <section class="section" aria-label="Profiles">
    <h2>Profiles</h2>
    <div class="row">
      <button type="button" id="new-profile-btn" class="btn">+ New</button>
      <button type="button" id="rename-profile-btn" class="btn">Rename</button>
      <button type="button" id="delete-profile-btn" class="btn">Delete</button>
    </div>
  </section>

  <!-- Status / result line -->
  <p id="status" class="status" aria-live="polite"></p>

  <!-- Inline modal overlay -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-card">
      <p id="modal-message" class="modal-message"></p>
      <input id="modal-input" class="modal-input" type="text" hidden />
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="modal-confirm" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../../core/storage.js"></script>
  <script src="../../core/ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
